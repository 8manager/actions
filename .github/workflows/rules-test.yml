name: Rules tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the pinned engines
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/og" https://github.com/opengrep/opengrep/releases/download/v1.25.0/opengrep_manylinux_x86
          echo "9ac4aebb47ba3f7b0d8fc641ac8749cb6c2f253f616131a67d9631e00d4bea33  $RUNNER_TEMP/og" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/og" /usr/local/bin/opengrep
          curl -fsSL -o "$RUNNER_TEMP/t.tgz" https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  $RUNNER_TEMP/t.tgz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f "$RUNNER_TEMP/t.tgz" trivy
      - name: Rule unit tests
        run: rules/test-rules.sh
