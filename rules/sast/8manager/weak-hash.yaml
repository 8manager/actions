rules:
  - id: weak-hash
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      MD5 and SHA-1 are broken for security use. If this hash protects a password, a token, a
      signature or integrity against tampering, use SHA-256 or better (or a password hash such as
      scrypt/argon2). For a cache key or a non-security checksum it is acceptable.
    # Test code is not shipped: fixture tokens, deliberate http:// cases and scratch files are expected there.
    paths:
      exclude: ["*.test.*", "*.spec.*", "**/__tests__/**", "**/__mocks__/**", "**/fixtures/**"]
    metadata:
      category: security
      cwe: ["CWE-328: Use of Weak Hash"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      references: ["https://cwe.mitre.org/data/definitions/328.html"]
      confidence: LOW
    patterns:
      - pattern-either:
          - pattern: $CRYPTO.createHash("$ALG")
          - pattern: createHash("$ALG")
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^(md4|md5|sha1|sha-1|ripemd160|rmd160)$
