rules:
  - id: cleartext-http
    languages: [javascript, typescript, python]
    severity: WARNING
    message: >-
      This URL uses plain http://, so anything sent over it — credentials, tokens, personal data —
      can be read or changed in transit. Use https:// (or wss://).
    # Test code is not shipped: fixture tokens, deliberate http:// cases and scratch files are expected there.
    paths:
      exclude: ["*.test.*", "*.spec.*", "**/__tests__/**", "**/__mocks__/**", "**/fixtures/**"]
    metadata:
      category: security
      cwe: ["CWE-319: Cleartext Transmission of Sensitive Information"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      references: ["https://cwe.mitre.org/data/definitions/319.html"]
      confidence: LOW
    patterns:
      - pattern: '"$URL"'
      - metavariable-regex:
          metavariable: $URL
          regex: ^(?i:http|ws)://(?!(?i:localhost|127\.|0\.0\.0\.0|\[::1\]|10\.|192\.168\.|host\.docker\.internal|[^/:]*\.(local|localhost|test|example|internal|invalid)(?:[:/]|$)|(?:[^/:]*\.)?example\.(?:com|org|net)|(?:www\.)?w3\.org|json-schema\.org|schemas\.|[^/:]*/schemas?/|purl\.org|ns\.adobe\.com|xmlns\.|apache\.org/xml|java\.sun\.com|adaptivecards\.io))[^\s]+$
      # A JSON-schema / namespace identifier is a name, not a connection.
      - pattern-not-inside: |
          {..., $schema: $S, ...}
