rules:
  - id: hardcoded-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A credential-like value is hard-coded in source. Read it from a secret store or an environment
      variable instead, and rotate it if it was ever a real credential.
    # Test code is not shipped: fixture tokens, deliberate http:// cases and scratch files are expected there.
    paths:
      exclude: ["*.test.*", "*.spec.*", "**/__tests__/**", "**/__mocks__/**", "**/fixtures/**"]
    metadata:
      category: security
      subcategory: [secret]
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      references: ["https://cwe.mitre.org/data/definitions/798.html"]
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: const $NAME = "$VALUE";
          - pattern: let $NAME = "$VALUE";
          - pattern: var $NAME = "$VALUE";
          - pattern: $OBJ.$NAME = "$VALUE";
          - pattern: |
              {..., $NAME: "$VALUE", ...}
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(secret|passw(or)?d|passwd|pwd|token|api_?key|apikey|auth|credential|private_?key|access_?key|client_?key)
      # Long, no whitespace, letters AND digits: a key, not a label, a header name or a sentence.
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?=\S*[0-9])(?=\S*[A-Za-z])\S{16,}$
      # Not a URL/path, not a placeholder, not a reference to somewhere else.
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?!(?i:https?://|/|\./|process\.env|env:|vault:|arn:))(?!.*(?i:changeme|change_me|example|placeholder|dummy|your[_-]|xxxx|redacted|\$\{|\{\{|<[a-z_-]+>))(?![A-Z0-9_]+$)(?!(?=[^A-Z]*[g-z])[a-z0-9]{1,12}(?:[-_][a-z0-9]{1,12}){2,}$).*$

  - id: hardcoded-secret
    languages: [python]
    severity: ERROR
    message: >-
      A credential-like value is hard-coded in source. Read it from a secret store or an environment
      variable instead, and rotate it if it was ever a real credential.
    # Test code is not shipped: fixture tokens, deliberate http:// cases and scratch files are expected there.
    paths:
      exclude: ["*.test.*", "*.spec.*", "**/__tests__/**", "**/__mocks__/**", "**/fixtures/**"]
    metadata:
      category: security
      subcategory: [secret]
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      references: ["https://cwe.mitre.org/data/definitions/798.html"]
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $NAME = "$VALUE"
          - pattern: $OBJ.$NAME = "$VALUE"
          - pattern: $F(..., $NAME="$VALUE", ...)
          - pattern: |
              {..., "$NAME": "$VALUE", ...}
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(secret|passw(or)?d|passwd|pwd|token|api_?key|apikey|auth|credential|private_?key|access_?key|client_?key)
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?=\S*[0-9])(?=\S*[A-Za-z])\S{16,}$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?!(?i:https?://|/|\./|env:|vault:|arn:))(?!.*(?i:changeme|change_me|example|placeholder|dummy|your[_-]|xxxx|redacted|\$\{|\{\{|<[a-z_-]+>))(?![A-Z0-9_]+$)(?!(?=[^A-Z]*[g-z])[a-z0-9]{1,12}(?:[-_][a-z0-9]{1,12}){2,}$).*$
