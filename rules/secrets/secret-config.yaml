# Extra secret rules for config files (.env, YAML, JSON, properties, ini, shell). Trivy's built-in
# rules only know provider-specific formats (AWS, GitHub, Slack, ...); this adds the generic
# "password/token/secret = <long literal>" case. Source code is left to the SAST rule
# rules/sast/8manager/hardcoded-secret.yaml, which understands the syntax — hence the path allow-rule.
# Trivy matches with Go RE2: no look-arounds, so exclusions are allow-rules on the matched value.
rules:
  - id: generic-hardcoded-secret
    category: general
    title: Hard-coded credential in a configuration file
    severity: HIGH
    keywords: [secret, password, passwd, pwd, token, apikey, api_key, api-key, access_key, access-key, client_secret, auth]
    regex: (?i)(?:secret|passw(?:or)?d|pwd|token|api[_-]?key|access[_-]?key|client[_-]?secret|auth)[a-z0-9_.\-]*["']?\s*[:=]\s*["']?(?P<secret>[A-Za-z0-9+/=_\-.~!@#%^&*?]{16,})
    secret-group-name: secret
    allow-rules:
      - id: source-code
        description: Source code is covered by the SAST hard-coded secret rule
        path: \.(?:[cm]?js|jsx|tsx?|py|java|go|rb|php|cs|kt|swift|scala)$
      - id: examples-and-docs
        description: Example and documentation files hold placeholders
        path: (?i)(?:\.example|\.sample|\.template|\.dist|\.md|\.rst|\.txt|\.lock|lock\.ya?ml|lock\.json)$
      - id: letters-only
        description: Names and references (no digits) are not keys. Allow-rules see the whole match, so anchor on the assignment.
        regex: '[:=]\s*["'']?[A-Za-z_.\-/]+$'
      - id: placeholders
        description: Placeholders and indirections
        regex: (?i)(?:changeme|change_me|example|placeholder|dummy|your[_-]|xxxx|redacted|\$\{|\{\{|<[a-z_-]+>|[:=]\s*["']?(?:env\.|secrets\.|vault:|arn:|https?:))
